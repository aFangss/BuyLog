name: PR Build Check

on:
  pull_request:
    branches: [master]

jobs:
  # 按修改路径决定需要验证哪些平台
  # shared/composeApp/gradle 配置属于公共代码，变化时三端全部验证
  changes:
    name: Detect affected platforms
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      web: ${{ steps.filter.outputs.web }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'shared/**'
              - 'composeApp/**'
              - 'androidApp/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
            web:
              - 'shared/**'
              - 'composeApp/**'
              - 'webApp/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
            ios:
              - 'shared/**'
              - 'composeApp/**'
              - 'iosApp/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'

  android:
    name: Android (assembleDebug)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android
        run: ./gradlew :androidApp:assembleDebug --console=plain

  web:
    name: Web (jsBrowserDistribution)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Web
        run: ./gradlew :webApp:jsBrowserDistribution --console=plain

  ios:
    name: iOS (framework compile)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build iOS framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --console=plain
